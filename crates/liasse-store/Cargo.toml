[package]
name = "liasse-store"
description = "Storage contract consumed by the runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Canonical typed keys/values at the storage boundary — never bare strings for
# identities. Rows are keyed by the Annex B `Value` order these crates define.
liasse-value = { path = "../liasse-value" }
liasse-ident = { path = "../liasse-ident" }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "store_bench"
harness = false

[lints]
workspace = true
